<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Calculator</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #101827, #263b61);
    font-family: 'Segoe UI', sans-serif;
    transition: 0.3s;
}

.calculator {
    width: 340px;
    padding: 25px;
    border-radius: 25px;
    background: #172238;
    box-shadow: 0 20px 50px #0008;
}

.header {
    display: flex;
    justify-content: space-between;
    color: white;
    margin-bottom: 25px;
    align-items: center;
}

.header button {
    border: none;
    padding: 8px 12px;
    border-radius: 10px;
    cursor: pointer;
}

.display {
    background: #0c1526;
    color: white;
    padding: 20px;
    text-align: right;
    border-radius: 15px;
    margin-bottom: 20px;
    min-height: 105px;
    overflow: hidden;
}

#previous {
    color: #94a3b8;
    font-size: 14px;
    min-height: 20px;
}

#current {
    font-size: 34px;
    margin-top: 8px;
    overflow-wrap: anywhere;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

button {
    border: none;
    height: 60px;
    border-radius: 15px;
    font-size: 20px;
    font-weight: 600;
    cursor: pointer;
    background: #293953;
    color: white;
    transition: 0.2s;
}

.buttons button:hover {
    filter: brightness(1.3);
    transform: translateY(-2px);
}

.operator {
    background: #365b91;
}

.clear {
    background: #d64b55;
}

.equal {
    background: #16a875;
    grid-column: span 2;
}

.light {
    background: linear-gradient(135deg, #dbeafe, #e2e8f0);
}

.light .calculator {
    background: white;
}

.light .header {
    color: #172238;
}

.light .display {
    background: #e8eef7;
    color: #172238;
}

.light #previous {
    color: #64748b;
}

.light .buttons button {
    background: #dbe5f2;
    color: #172238;
}

.light .buttons .operator {
    background: #9fc5f5;
}

.light .buttons .clear {
    background: #ef9da3;
}

.light .buttons .equal {
    background: #6bd6aa;
}

@media(max-width: 400px) {
    .calculator {
        width: 92%;
        padding: 18px;
    }
}
</style>
</head>

<body>

<div class="calculator">

    <div class="header">
        <h2>PRO CALCULATOR</h2>
        <button onclick="toggleTheme()">☀️</button>
    </div>

    <div class="display">
        <div id="previous"></div>
        <div id="current">0</div>
    </div>

    <div class="buttons">
        <button class="clear" onclick="clearAll()">AC</button>
        <button onclick="deleteLast()">DEL</button>
        <button onclick="percentage()">%</button>
        <button class="operator" onclick="chooseOperator('/')">÷</button>

        <button onclick="append('7')">7</button>
        <button onclick="append('8')">8</button>
        <button onclick="append('9')">9</button>
        <button class="operator" onclick="chooseOperator('*')">×</button>

        <button onclick="append('4')">4</button>
        <button onclick="append('5')">5</button>
        <button onclick="append('6')">6</button>
        <button class="operator" onclick="chooseOperator('-')">−</button>

        <button onclick="append('1')">1</button>
        <button onclick="append('2')">2</button>
        <button onclick="append('3')">3</button>
        <button class="operator" onclick="chooseOperator('+')">+</button>

        <button onclick="toggleSign()">±</button>
        <button onclick="append('0')">0</button>
        <button onclick="append('.')">.</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>

</div>

<script>
let current = '0';
let previous = '';
let operator = null;
let reset = false;

const currentEl = document.getElementById('current');
const previousEl = document.getElementById('previous');

function update() {
    currentEl.textContent = current;
    previousEl.textContent =
        previous && operator ? previous + ' ' + operator : '';
}

function append(value) {
    if (reset) {
        current = '0';
        reset = false;
    }

    if (value === '.' && current.includes('.')) return;

    if (current === '0' && value !== '.') {
        current = value;
    } else {
        current += value;
    }
    update();
}

function chooseOperator(op) {
    if (operator && !reset) calculate();

    previous = current;
    operator = op;
    reset = true;
    update();
}

function calculate() {
    if (!operator || reset) return;

    let a = Number(previous);
    let b = Number(current);
    let result;

    switch(operator) {
        case '+': result = a + b; break;
        case '-': result = a - b; break;
        case '*': result = a * b; break;
        case '/':
            if (b === 0) {
                current = 'Cannot divide by zero';
                previous = '';
                operator = null;
                reset = true;
                update();
                return;
            }
            result = a / b;
            break;
    }

    current = String(Number(result.toPrecision(12)));
    previous = '';
    operator = null;
    reset = true;
    update();
}

function clearAll() {
    current = '0';
    previous = '';
    operator = null;
    reset = false;
    update();
}

function deleteLast() {
    if (reset) return;
    current = current.length > 1 ? current.slice(0,-1) : '0';
    update();
}

function percentage() {
    current = String(Number(current) / 100);
    update();
}

function toggleSign() {
    if (current !== '0') {
        current = String(-Number(current));
        update();
    }
}

function toggleTheme() {
    document.body.classList.toggle('light');
}

document.addEventListener('keydown', (e) => {
    if (e.key >= '0' && e.key <= '9') append(e.key);
    else if (e.key === '.') append('.');
    else if (['+', '-', '*', '/'].includes(e.key)) chooseOperator(e.key);
    else if (e.key === 'Enter' || e.key === '=') calculate();
    else if (e.key === 'Backspace') deleteLast();
    else if (e.key === 'Escape') clearAll();
    else if (e.key === '%') percentage();
});
</script>

</body>
</html>
